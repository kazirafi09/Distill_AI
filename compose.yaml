services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in .env}
    ports:
      - "127.0.0.1:5442:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  chromadb:
    image: chromadb/chroma:1.5.9
    restart: unless-stopped
    ports:
      - "127.0.0.1:8001:8000"
    volumes:
      - chroma_data:/data

  ollama:
    image: ollama/ollama:0.35.1
    restart: unless-stopped
    ports:
      - "127.0.0.1:11435:11434"
    environment:
      OLLAMA_HOST: "0.0.0.0:11434"
      OLLAMA_MAX_LOADED_MODELS: "1"
      OLLAMA_NUM_PARALLEL: "1"
      OLLAMA_KEEP_ALIVE: "1m"
    volumes:
      - ollama_data:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  backend: &backend_runtime
    build:
      context: ./backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      OLLAMA_BASE_URL: "http://ollama:11434"
      OLLAMA_EMBEDDING_MODEL: "qwen3-embedding:0.6b"
      CV_PARSER_MODEL: "${CV_PARSER_MODEL:-qwen3:4b}"
      CV_MCP_URL: "http://backend:8000/mcp/"
      EMAIL_MCP_URL: "http://email-mcp:8003/mcp/"
      CHROMA_HOST: chromadb
      CHROMA_PORT: "8000"
      WATCHFILES_FORCE_POLLING: "true"
      OMP_THREAD_LIMIT: "2"
      GOOGLE_APPLICATION_CREDENTIALS: /run/secrets/google-drive-service-account.json
      CV_STORAGE_PATH: /workspace/storage/cvs
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ./backend/app:/workspace/backend/app
      - ./backend/migrations:/workspace/backend/migrations
      - ./backend/alembic.ini:/workspace/backend/alembic.ini:ro
      - ./storage/cvs:/workspace/storage/cvs
      - type: bind
        source: ${GOOGLE_DRIVE_CREDENTIALS_HOST_PATH:?Set GOOGLE_DRIVE_CREDENTIALS_HOST_PATH in .env}
        target: /run/secrets/google-drive-service-account.json
        read_only: true
        bind:
          create_host_path: false
    depends_on:
      postgres:
        condition: service_healthy
      ollama:
        condition: service_healthy
      chromadb:
        condition: service_started
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/db', timeout=5).read()"
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 30s

  cv-worker:
    <<: *backend_runtime
    command: ["python", "-m", "app.scripts.cv_screening_worker"]
    ports: []
    healthcheck:
      disable: true
    depends_on:
      backend:
        condition: service_healthy

  email-mcp:
    <<: *backend_runtime
    command:
      - python
      - -m
      - uvicorn
      - app.mcp_email:app
      - --host
      - 0.0.0.0
      - --port
      - "8003"
    ports:
      - "127.0.0.1:8003:8003"
    healthcheck:
      disable: true

  invitation-worker:
    <<: *backend_runtime
    command: ["python", "-m", "app.scripts.invitation_worker"]
    ports: []
    healthcheck:
      disable: true
    depends_on:
      backend:
        condition: service_healthy
      email-mcp:
        condition: service_started

  frontend:
    build:
      context: ./frontend
    restart: unless-stopped
    environment:
      API_PROXY_TARGET: "http://backend:8000"
      DOCKER_WATCH_POLLING: "true"
    ports:
      - "127.0.0.1:5173:5173"
    volumes:
      - ./frontend:/workspace/frontend
      - frontend_node_modules:/workspace/frontend/node_modules
    depends_on:
      backend:
        condition: service_healthy

volumes:
  postgres_data:
  chroma_data:
  ollama_data:
  frontend_node_modules:
